[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaomu"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "click>=8.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest"]
admin = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "argon2-cffi>=23",
    "aiosqlite>=0.19",
]

[project.scripts]
zhaomu = "zhaomu.cli:cli"

[tool.setuptools.packages.find]
include = ["zhaomu*", "admin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
